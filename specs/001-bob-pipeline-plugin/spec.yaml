feature: "bob-pipeline — Claude Code plugin: development pipeline following Uncle Bob's flow"
branch: "master"
created: "2026-07-29"
status: "Draft"
input: "Claude Code plugin \"bob-pipeline\": development pipeline following Uncle Bob's flow (SwarmForge) — 6 subagent roles (Specifier, Coder, Cleaner, Architect, Hardener, QA) replacing human code review, a \"test gauntlet\" as the quality gate. Two modes (standalone and on top of yamlkit artifacts), config via an interview on /bob-init, per-feature override of skipped steps, configurable human gates (default: approval of Gherkin+QA scenarios before code + final QA report), per-role models, one worktree per run + role commit before handoff, stack adaptation via a tool registry with fallback research, Gherkin as a traceable document (BDD framework optional), in-place auto-fix + pipeline send-back only on semantic failures (limit 3), night mode, parallel slices, /bob-config. v1 includes everything."

user_stories:
  - id: "US1"
    title: "Installing and setting up the pipeline in a project (/bob-init)"
    priority: "P1"
    description: "A developer installs the plugin in a project and, with a single /bob-init command, goes through a short interview: the plugin scans the project, determines the technology stack, selects quality tools (mutation, coverage, duplication/complexity) from a registry, deploys six role agents adapted to the project's domain and stack, and records all decisions in a config file."
    motivation:
      problem: "A disciplined AI flow (TDD, test gauntlet, roles) currently has to be assembled by hand for every project: role prompts, stack-specific tools, quality thresholds."
      value: "A single /bob-init call turns any project into a platform for Bob's pipeline: roles, tools, and thresholds are chosen for the stack and recorded reproducibly."
      consequence_if_skipped: "Every project is configured by hand, configs drift apart, colleagues can't reuse the flow."
    why_priority: "Nothing else works without initialization — this is the plugin's entry point."
    independent_test: "In a fresh project with a known stack, call /bob-init, answer the interview questions, and verify that the config and role agents are created and the selected tools match the stack."
    acceptance_scenarios:
      - id: "AS-1"
        given: "A C# project with no bob-pipeline config"
        when: "The developer calls /bob-init and answers the interview questions"
        then: "A .claude/bob-pipeline.yaml config is created with roles, models, thresholds, and tools (mutation/coverage/duplication) for C#, and 6 role agents adapted to the stack are deployed into the project"
      - id: "AS-2"
        given: "A project on a stack absent from the tool registry"
        when: "The developer calls /bob-init"
        then: "The plugin searches the internet for suitable tools, offers the findings to the developer for confirmation, and records the choice in the config; for categories with no tool found, the step is marked disabled with an explicit warning"
      - id: "AS-3"
        given: "A project with an existing bob-pipeline config"
        when: "The developer calls /bob-init again"
        then: "The plugin shows the existing config and asks whether to recreate or keep it; it never silently overwrites anything"
    acceptance_criteria:
      - id: "AC-1"
        description: "After /bob-init, the project has a machine-readable config listing enabled roles, per-role model, gate thresholds, and selected quality tools"
        done: false
      - id: "AC-2"
        description: "Role agents are deployed into the project with project-specific values (name, domain, stack) substituted in place of placeholders"
        done: false
      - id: "AC-3"
        description: "For stacks present in the registry (C#, TS/JS, Python, Java), tools are selected without any internet access"
        done: false
      - id: "AC-4"
        description: "Re-running /bob-init does not overwrite the existing config without explicit confirmation"
        done: false
    test_scenarios:
      - id: "TS-1"
        given:
          - "A fresh C# project with a csproj and a test project"
        when: "/bob-init is run with default interview answers"
        then:
          - "The config is created and passes structural validation"
          - "The config selects mutation and coverage tools from the registry for C#"
          - "6 role agents are deployed with no remaining placeholders"
        verification:
          - "manual"
        level: "integration"
      - id: "TS-2"
        given:
          - "A project on an exotic stack (not in the registry)"
        when: "/bob-init is run"
        then:
          - "Internet-found tools are proposed, or the step is marked disabled with a warning"
        verification:
          - "manual"
        level: "e2e"

  - id: "US2"
    title: "Running a feature through the pipeline (/bob-run, standalone)"
    priority: "P1"
    description: "A developer describes a feature in text and calls /bob-run. The Specifier turns the description into Gherkin specs, QA scenarios, and a cut into behavior slices; after human approval, each slice sequentially passes through the roles Coder (TDD) → Cleaner (refactoring) → Architect (boundaries/dependencies) → Hardener (mutation gauntlet) → QA (executable checks). Code is never shown to the human; each role commits its result before handing off to the next."
    motivation:
      problem: "Without a pipeline, AI writes code with no discipline: no executable specification, no mechanical quality gates, and the human is forced to read and review the agent's code, losing the whole benefit."
      value: "The human approves only the intent (Gherkin) and gets a final QA report; code quality is guaranteed by the test and metrics gauntlet, not by eyeballing."
      consequence_if_skipped: "The plugin fails to perform its core function — this is the product's heart."
    why_priority: "The main use case the plugin exists for."
    independent_test: "In an initialized project, run /bob-run with a description of a small feature, approve the Gherkin, wait for the final QA report, and verify that all gates passed and the git history has a commit from every role."
    acceptance_scenarios:
      - id: "AS-1"
        given: "An initialized project and a text description of a feature"
        when: "The developer calls /bob-run with the description"
        then: "The Specifier presents Gherkin specs, QA scenarios, and a slice breakdown for approval before coding starts"
      - id: "AS-2"
        given: "Approved Gherkin specs and slice breakdown"
        when: "The pipeline executes a slice"
        then: "Roles run sequentially (Coder → Cleaner → Architect → Hardener → QA), each role finishes with a commit tagged with its role, the run happens in an isolated worktree and does not touch the developer's working copy"
      - id: "AS-3"
        given: "All slices passed their gates"
        when: "The pipeline finishes"
        then: "The developer receives a final QA report (scenario statuses, gate metrics, links to role commits) and the changes are merged from the worktree into the feature branch"
      - id: "AS-4"
        given: "The developer rejected the Gherkin specs at the gate"
        when: "They leave feedback"
        then: "The Specifier reworks the specs based on the feedback and resubmits them; no code is written before approval"
    acceptance_criteria:
      - id: "AC-1"
        description: "Not a single line of implementation code is created before Gherkin approval"
        done: false
      - id: "AC-2"
        description: "Each role leaves a separate commit before handoff — every role's contribution is recoverable from git history"
        done: false
      - id: "AC-3"
        description: "The run happens in a separate worktree; the developer's working copy is unchanged until the final merge"
        done: false
      - id: "AC-4"
        description: "The final QA report contains the status of every Gherkin scenario, gate metric values per slice, and the run's overall outcome"
        done: false
      - id: "AC-5"
        description: "Acceptance tests are traceable to Gherkin scenarios (via tag or name); test coverage of scenarios is 100% of approved scenarios"
        done: false
    test_scenarios:
      - id: "TS-1"
        given:
          - "An initialized test project"
          - "A feature description with 2-3 behavior scenarios"
        when: "A full /bob-run pass is executed with Gherkin approval"
        then:
          - "The git history contains commits from all enabled roles"
          - "A QA report is produced, all scenarios green"
          - "The working copy was unchanged before the merge"
        verification:
          - "manual"
        level: "e2e"
      - id: "TS-2"
        given:
          - "Gherkin rejected with feedback"
        when: "The Specifier reworks the spec"
        then:
          - "The new version addresses the feedback"
          - "No code is created before re-approval"
        verification:
          - "manual"
        level: "integration"

  - id: "US3"
    title: "Integration with yamlkit (mode on top of spec artifacts)"
    priority: "P2"
    description: "In a project where a feature has already gone through yamlkit (spec/plan/tasks), /bob-run automatically detects the artifacts: the specification becomes the Specifier's input (Gherkin is generated from it instead of free text), the slice breakdown comes from tasks, and the pipeline executes the slices instead of the standard yamlkit-implement."
    motivation:
      problem: "Teams working a spec-driven flow already have a specification and tasks — making the Specifier reinvent the breakdown means duplicating work and creating divergence."
      value: "One source of truth: spec artifacts produce Gherkin and slices, and Bob's pipeline becomes an execution discipline inside the familiar flow."
      consequence_if_skipped: "Two unrelated flows in one project: the spec on one side, the pipeline on the other, manual synchronization."
    why_priority: "Valuable for the user's existing yamlkit projects, but the standalone mode is self-sufficient."
    independent_test: "In a project with ready spec.yaml/tasks.yaml, call /bob-run with no feature description and verify Gherkin is generated from the spec and slices match the tasks."
    acceptance_scenarios:
      - id: "AS-1"
        given: "A project with a yamlkit feature directory (spec and tasks present)"
        when: "The developer calls /bob-run"
        then: "The plugin automatically detects integration mode, builds Gherkin from the specification, and forms slices from the tasks; no free-text feature description is requested"
      - id: "AS-2"
        given: "A project with no yamlkit artifacts"
        when: "The developer calls /bob-run with a text description"
        then: "The plugin works in standalone mode with no requirement for yamlkit to be present"
      - id: "AS-3"
        given: "A project with partial artifacts (a specification exists, no tasks)"
        when: "The developer calls /bob-run"
        then: "Gherkin is built from the specification, and the Specifier performs the slice breakdown and presents it at the same approval gate"
    acceptance_criteria:
      - id: "AC-1"
        description: "The mode (standalone/integration) is determined automatically from artifact presence, with no user flag"
        done: false
      - id: "AC-2"
        description: "In integration mode, each Gherkin scenario traces to a specification requirement, and each slice traces to a task"
        done: false
      - id: "AC-3"
        description: "The plugin is fully functional in a project where yamlkit is not installed"
        done: false
    test_scenarios:
      - id: "TS-1"
        given:
          - "A project with ready yamlkit spec and tasks artifacts"
        when: "/bob-run is executed"
        then:
          - "Pipeline slices match the tasks"
          - "Gherkin references the spec's requirements"
        verification:
          - "manual"
        level: "e2e"

  - id: "US4"
    title: "Per-feature step skipping and config override"
    priority: "P2"
    description: "Before running a feature, the developer explicitly specifies which roles to skip (\"skip Hardener and Architect\") or which parameters to override; the pipeline executes only the remaining roles, recording the deviation from the base config in the report."
    motivation:
      problem: "Not every feature needs the full gauntlet: for small changes, mutation testing and architectural review are extra time and tokens (Bob himself: \"often I only use unit tests\")."
      value: "Flexible calibration of rigor to the task's criticality with a single argument, without editing the base config."
      consequence_if_skipped: "Either the full pipeline runs always (expensive and slow), or the config is manually edited back and forth."
    why_priority: "A key user requirement, but it operates on top of an already-working pipeline."
    independent_test: "Run /bob-run specifying two roles to skip and verify they didn't execute and the report records the skip."
    acceptance_scenarios:
      - id: "AS-1"
        given: "An initialized project"
        when: "The developer calls /bob-run specifying to skip Hardener"
        then: "The Hardener role does not execute, there are no commits or gates from it, and the final report explicitly lists the skipped roles"
      - id: "AS-2"
        given: "A request to skip a mandatory role (Coder)"
        when: "The developer calls /bob-run"
        then: "The plugin refuses, explaining which roles cannot be disabled (Specifier and Coder), and does not start the run"
    acceptance_criteria:
      - id: "AC-1"
        description: "Skipped roles do not execute and do not consume tokens"
        done: false
      - id: "AC-2"
        description: "The run report lists the skipped roles and overridden parameters"
        done: false
      - id: "AC-3"
        description: "Specifier and Coder cannot be skipped; an attempt is rejected with an explanation"
        done: false
    test_scenarios:
      - id: "TS-1"
        given:
          - "An initialized project"
        when: "/bob-run is executed skipping Hardener and QA"
        then:
          - "The commit history has no commits from Hardener/QA"
          - "The report lists the skips"
        verification:
          - "manual"
        level: "integration"

  - id: "US5"
    title: "Human gates and night autonomous mode"
    priority: "P2"
    description: "By default, the pipeline stops twice: approval of Gherkin+QA scenarios before code, and the final QA report. The set of gates is configurable. In night mode, the pipeline runs with zero interactive questions: gates are disabled, a failing slice is marked and skipped, and in the morning the developer receives a summary report across all slices."
    motivation:
      problem: "During the day, intent control is needed; at night, the pipeline must run autonomously — any interactive pause kills a night run."
      value: "Maximum autonomy without losing control: the human controls intent and sees the outcome, while the pipeline runs while the developer sleeps."
      consequence_if_skipped: "The pipeline sits idle at night or stalls on the first question; or, conversely, there's no intent control during the day."
    why_priority: "Autonomy is the second most important value of Bob's flow after the gauntlet."
    independent_test: "Run a pass in night mode on a feature with a deliberately failing slice and verify the run finishes with no questions and the morning report includes statuses for all slices, including the failed one."
    acceptance_scenarios:
      - id: "AS-1"
        given: "Config with default gates"
        when: "A normal run is in progress"
        then: "The pipeline stops exactly twice: Gherkin approval before code, and the final report"
      - id: "AS-2"
        given: "A run started in night mode"
        when: "The pipeline executes all slices"
        then: "Not a single interactive question is asked; the Gherkin gate is replaced by auto-approval with a note in the report"
      - id: "AS-3"
        given: "In a night run, a slice exhausted its iteration limit"
        when: "The gate remains unpassed"
        then: "The slice is marked failed, its changes don't go into the merge, the pipeline moves to the next independent slice, and the morning report contains the diagnosis"
    acceptance_criteria:
      - id: "AC-1"
        description: "The default configuration gives exactly two gates: Gherkin approval and the final report"
        done: false
      - id: "AC-2"
        description: "Night mode asks not a single interactive question during the entire run"
        done: false
      - id: "AC-3"
        description: "A slice failure at night does not crash the run: the slice is marked, independent slices are executed, and a summary report is produced"
        done: false
      - id: "AC-4"
        description: "Changes from a failed slice do not go into the final merge"
        done: false
    test_scenarios:
      - id: "TS-1"
        given:
          - "A feature with two independent slices, one of which is deliberately failing"
        when: "The night run finishes"
        then:
          - "The healthy slice is merged, the failing one is not"
          - "The summary report contains both statuses and the failure diagnosis"
        verification:
          - "manual"
        level: "e2e"

  - id: "US6"
    title: "Quality gauntlet: auto-fix, send-backs, and thresholds"
    priority: "P1"
    description: "Each checking role fixes in place whatever falls within its competence (Hardener finishes off surviving mutants with tests itself, Cleaner cleans up itself), and sends back through the pipeline only semantic failures: a failed QA scenario → Coder, a rejected structure → Cleaner/Coder. Send-backs are limited by an iteration cap; gate thresholds: mutation score no lower than the threshold (default 80%), coverage — informational, complexity/duplication — no worse than the baseline."
    motivation:
      problem: "Without mechanical gates, \"no one reads the code\" turns into \"no one controls quality\"; without limits, agents chew endlessly on their own mess."
      value: "Quality is guaranteed by an executable gauntlet with measurable thresholds; fix cycles either converge or stop honestly with a diagnosis."
      consequence_if_skipped: "Bob's flow loses its load-bearing structure — trust in code with no human review has no basis."
    why_priority: "The gauntlet is the very thing replacing code review — the core of the method."
    independent_test: "Feed a slice with weak tests and verify Hardener pushed the mutation score up to the threshold itself; feed a slice with incorrect behavior and verify that after a QA failure the work returned to the Coder and the cycle is bounded by the limit."
    acceptance_scenarios:
      - id: "AS-1"
        given: "After the Coder, mutants survived (score below threshold)"
        when: "The Hardener works"
        then: "The Hardener writes additional tests itself until the threshold is reached, without sending work back to the Coder"
      - id: "AS-2"
        given: "A QA scenario failed (behavior is incorrect)"
        when: "QA records the failure"
        then: "The slice is sent back to the Coder with a diagnosis; after the fix, the slice goes through the subsequent roles again"
      - id: "AS-3"
        given: "A slice has been sent back for fixing the maximum number of times (default 3)"
        when: "The gate fails again"
        then: "The pipeline stops the slice and produces a report with a diagnosis (in night mode — marks the slice and continues)"
      - id: "AS-4"
        given: "The Cleaner made the complexity metric worse relative to the baseline"
        when: "The \"no worse than baseline\" gate is computed"
        then: "The gate fails, and the Cleaner cleans up further in place"
    acceptance_criteria:
      - id: "AC-1"
        description: "Surviving mutants are eliminated by the Hardener in place, with no pipeline send-back"
        done: false
      - id: "AC-2"
        description: "Pipeline send-back happens only on semantic failures (QA-fail, Architect-fail); send-back routes are defined in the config"
        done: false
      - id: "AC-3"
        description: "The number of send-backs per slice is limited by a configurable cap (default 3); exceeding it stops the run with a diagnosis"
        done: false
      - id: "AC-4"
        description: "Gates are computed mechanically: mutation score ≥ threshold, complexity/duplication no worse than baseline; coverage is reported informationally and does not block the run"
        done: false
    test_scenarios:
      - id: "TS-1"
        given:
          - "A slice with tests that let mutants survive"
        when: "The Hardener finishes its work"
        then:
          - "Mutation score is no lower than the threshold"
          - "There were no send-backs to the Coder"
        verification:
          - "manual"
        level: "integration"
      - id: "TS-2"
        given:
          - "A slice with incorrect behavior that the Coder cannot fix"
        when: "The send-back limit is exhausted"
        then:
          - "The slice run is stopped with a diagnosis, no infinite loop occurs"
        verification:
          - "manual"
        level: "integration"

  - id: "US7"
    title: "Parallel slices"
    priority: "P3"
    description: "Independent feature slices (with no mutual dependencies) execute simultaneously, each in its own worktree pipeline, with sequential merging of results per protocol; dependent slices wait for their predecessors."
    motivation:
      problem: "A sequential run of a long feature made of independent pieces takes the sum of all slice durations, even though the slices don't interfere with each other."
      value: "The feature's run time approaches the duration of the longest slice rather than the sum of all of them."
      consequence_if_skipped: "A night run may not finish overnight; the pipeline loses on speed to Bob's original scheme."
    why_priority: "A speed optimization; pipeline correctness doesn't depend on it."
    independent_test: "A feature with two independent slices: verify the slices ran simultaneously (overlapping execution intervals), both results merged without loss."
    acceptance_scenarios:
      - id: "AS-1"
        given: "A breakdown with independent slices and parallelism enabled"
        when: "A run is started"
        then: "Independent slices execute simultaneously in separate worktrees, the number of concurrent pipelines is limited by a setting"
      - id: "AS-2"
        given: "Slice B depends on slice A"
        when: "Execution is scheduled"
        then: "B does not start before A's successful merge"
      - id: "AS-3"
        given: "Merging a parallel slice produces a conflict"
        when: "The merge is performed"
        then: "The conflict is resolved per the merge protocol; if unresolvable, the slice is flagged for manual merge in the report, other slices are unaffected"
    acceptance_criteria:
      - id: "AC-1"
        description: "Dependencies between slices are honored: a dependent slice never starts before its predecessor's successful completion"
        done: false
      - id: "AC-2"
        description: "The number of concurrent pipelines is limited by a configurable cap"
        done: false
      - id: "AC-3"
        description: "An unresolvable merge conflict does not crash the run: the slice is flagged, the rest complete"
        done: false
    test_scenarios:
      - id: "TS-1"
        given:
          - "A feature with two independent slices"
        when: "A run with parallelism enabled completes"
        then:
          - "The slices' execution intervals overlap"
          - "Both slices are merged, the result is consistent"
        verification:
          - "manual"
        level: "e2e"

  - id: "US8"
    title: "Configuration management (/bob-config)"
    priority: "P3"
    description: "At any time, the developer calls /bob-config to discuss and change recorded decisions: replace a quality tool, change thresholds, role models, the set of gates, or send-back routes; changes are validated and applied to subsequent runs."
    motivation:
      problem: "Tool and threshold choices frozen at init go stale: new tools appear, rigor requirements change."
      value: "The configuration lives and changes in an explicit, managed way, rather than by manually editing YAML at random."
      consequence_if_skipped: "The only way to change anything is recreating the config via /bob-init or manual editing with no validation."
    why_priority: "A maintenance convenience; doesn't affect the first run."
    independent_test: "Call /bob-config, replace the mutation tool and threshold, verify the next run uses the new values."
    acceptance_scenarios:
      - id: "AS-1"
        given: "An initialized project"
        when: "The developer calls /bob-config and asks to replace the mutation tool"
        then: "The plugin discusses options, applies the choice to the config, and confirms the change; the next run uses the new tool"
      - id: "AS-2"
        given: "An invalid change is requested (threshold out of range, unknown role)"
        when: "The change is applied"
        then: "The plugin rejects the change with an explanation, the config remains valid"
    acceptance_criteria:
      - id: "AC-1"
        description: "Changes made via /bob-config apply to subsequent runs without recreating the config"
        done: false
      - id: "AC-2"
        description: "Invalid changes are rejected with an explanation, the config is never left in an invalid state"
        done: false
    test_scenarios:
      - id: "TS-1"
        given:
          - "A project with a default config"
        when: "The mutation score threshold is changed via /bob-config"
        then:
          - "The config is valid and contains the new threshold"
          - "The next run applies the new threshold"
        verification:
          - "manual"
        level: "integration"

edge_cases:
  - id: "EC-1"
    description: "A project with no test infrastructure (no test framework/project)"
    expected_behavior: "/bob-init detects the absence and offers to set up test infrastructure as part of initialization; /bob-run refuses to start without it, with an explanation"
  - id: "EC-2"
    description: "No mutation tool exists for the stack even after research"
    expected_behavior: "The Hardener role degrades to strengthening tests via heuristics (boundary values, negative cases), with an explicit note in the config and report that the mutation gate is unavailable"
  - id: "EC-3"
    description: "A dirty working copy (uncommitted changes) at the time of /bob-run"
    expected_behavior: "The run starts anyway, since it works in a separate worktree from the branch's latest commit; the user is warned that uncommitted changes will not be included in the run"
  - id: "EC-4"
    description: "The project is not a git repository"
    expected_behavior: "/bob-run refuses to start with an explanation (worktree and the audit trail require git); /bob-init offers to initialize the repository"
  - id: "EC-5"
    description: "A run is interrupted midway (session dropped, limits, error)"
    expected_behavior: "The run's state (current slice, role, iteration) is recorded in a state file inside the worktree; a subsequent /bob-run detects the unfinished run and offers to resume from the last role commit or discard it"
  - id: "EC-6"
    description: "Gherkin gate: the user doesn't respond, and the mode is not night mode"
    expected_behavior: "The pipeline waits for a response; there is no timeout auto-approval in day mode"
  - id: "EC-7"
    description: "No metrics baseline exists (first run in the project)"
    expected_behavior: "The first run records a baseline from the state before changes and evaluates \"no worse than baseline\" relative to it"
  - id: "EC-8"
    description: "A per-feature override conflicts with the config (a role is already disabled globally, and it's requested to be skipped)"
    expected_behavior: "The run proceeds, the duplication is noted in the report with no error"
  - id: "EC-9"
    description: "In integration mode, yamlkit artifacts changed between Gherkin approval and execution"
    expected_behavior: "The pipeline detects the divergence via a checksum of the input artifacts and requires re-approval of the affected slices"

functional_requirements:
  - id: "FR-001"
    text: "The plugin MUST provide an initialization command that scans the project, determines the technology stack, and through an interview with the user creates a machine-readable pipeline config (roles, models, gates, thresholds, tools, modes)."
    story_refs:
      - "US1"
  - id: "FR-002"
    text: "The plugin MUST contain a registry of quality tools (mutation, coverage, complexity/duplication) for at least C#, TypeScript/JavaScript, Python, and Java, and select tools from the registry without any internet access."
    story_refs:
      - "US1"
  - id: "FR-003"
    text: "WHEN the project's stack is absent from the registry, the plugin MUST search the internet for suitable tools, offer the result to the user for confirmation, and record the choice in the config; if no tool is found, the category is marked disabled with a warning."
    story_refs:
      - "US1"
  - id: "FR-004"
    text: "The plugin MUST deploy six role agents (Specifier, Coder, Cleaner, Architect, Hardener, QA) with prompts adapted to the project's name, domain, and stack."
    story_refs:
      - "US1"
      - "US2"
  - id: "FR-005"
    text: "The run command MUST present the user with Gherkin specifications, QA scenarios, and a slice breakdown before coding starts, and wait for explicit approval (except in night mode); on rejection, the Specifier MUST rework the artifacts based on the feedback."
    story_refs:
      - "US2"
      - "US5"
  - id: "FR-006"
    text: "The pipeline MUST execute each slice through a sequence of enabled roles, where each role starts as a subagent with a clean context and MUST finish its work with a git commit tagged with its role before handing off to the next."
    story_refs:
      - "US2"
  - id: "FR-007"
    text: "A feature run MUST execute in a separate git worktree; the user's working copy is not changed until the final merge, performed per the merge protocol."
    story_refs:
      - "US2"
      - "US7"
  - id: "FR-008"
    text: "Acceptance tests MUST be traceable to Gherkin scenarios via tag or name; by default Gherkin is a human-readable document, and tests are written with the project's standard test framework; a full BDD framework is enabled via a config option."
    story_refs:
      - "US2"
  - id: "FR-009"
    text: "WHEN yamlkit spec artifacts for the current feature are detected in the project, the plugin MUST automatically switch to integration mode: Gherkin is generated from the specification, slices come from the tasks; WHEN there are no artifacts — work standalone from a text description."
    story_refs:
      - "US3"
  - id: "FR-010"
    text: "The plugin MUST accept, at run start, an explicit list of roles to skip and parameters to override; Specifier and Coder MUST be non-disableable; all deviations from the base config MUST be recorded in the report."
    story_refs:
      - "US4"
  - id: "FR-011"
    text: "The execution model for each role MUST be settable in the config per-role (default: Specifier/Coder/Cleaner/Architect — sonnet, Hardener/QA — haiku) and passed explicitly to the subagent at launch."
    story_refs:
      - "US1"
      - "US2"
  - id: "FR-012"
    text: "The plugin MUST support a night mode: zero interactive questions during the run, auto-approval of Gherkin with a note, failing slices are marked and skipped, and a summary report across all slices is produced at completion."
    story_refs:
      - "US5"
  - id: "FR-013"
    text: "Checking roles MUST fix defects within their own competence in place (Hardener — finish off surviving mutants with tests, Cleaner — clean up metrics further); sending a slice back through the pipeline is allowed only on semantic failures via routes from the config (default: QA-fail → Coder, Architect-fail → Cleaner/Coder)."
    story_refs:
      - "US6"
  - id: "FR-014"
    text: "The number of send-backs per slice MUST be limited by a configurable cap (default 3); when exhausted, the pipeline MUST stop the slice with a diagnosis (in night mode — mark it and continue with the rest)."
    story_refs:
      - "US6"
      - "US5"
  - id: "FR-015"
    text: "Quality gates MUST be computed mechanically from tool output: mutation score no lower than a configurable threshold (default 80%), complexity/duplication metrics no worse than the baseline; coverage MUST be reported informationally and must not block the run."
    story_refs:
      - "US6"
  - id: "FR-016"
    text: "The final QA report MUST include the status of every Gherkin scenario, gate metric values per slice, the list of skipped roles and overrides, links to role commits, and the run's overall status."
    story_refs:
      - "US2"
      - "US4"
      - "US5"
  - id: "FR-017"
    text: "WHEN parallelism is enabled, independent slices MUST execute simultaneously in separate worktree pipelines with a configurable concurrency cap; dependent slices MUST wait for their predecessors' successful merge; an unresolvable merge conflict MUST flag the slice without derailing the rest."
    story_refs:
      - "US7"
  - id: "FR-018"
    text: "The plugin MUST provide a configuration management command allowing tools, thresholds, models, gates, and send-back routes to be discussed and changed with validation; invalid changes MUST be rejected with an explanation."
    story_refs:
      - "US8"
  - id: "FR-019"
    text: "The run state (slice, role, iteration) MUST be persisted; WHEN a run is interrupted, a subsequent invocation MUST offer to resume from the last role commit or discard the run."
    story_refs:
      - "US2"
      - "US5"
  - id: "FR-020"
    text: "The plugin MUST be distributed as a single installable Claude Code plugin package (commands, agents, templates, registry) requiring no manual file copying by the recipient."
    story_refs:
      - "US1"

key_entities:
  - id: "E-1"
    name: "PipelineConfig"
    description: "Machine-readable pipeline configuration in the project: enabled roles, per-role model, human gates, quality thresholds, selected tools, send-back routes, iteration and parallelism limits, modes (night, BDD)."
  - id: "E-2"
    name: "Role"
    description: "One of the pipeline's six roles (Specifier, Coder, Cleaner, Architect, Hardener, QA): prompt template, area of responsibility, completion criteria, execution model."
  - id: "E-3"
    name: "Slice"
    description: "A behavior slice — a unit of passage through the pipeline: a related group of Gherkin scenarios, dependencies on other slices, status, send-back counter, links to role commits."
  - id: "E-4"
    name: "GherkinSpec"
    description: "A human-readable specification of feature behavior (Given/When/Then scenarios) traceable to the original spec's requirements (in integration mode) and to acceptance tests."
  - id: "E-5"
    name: "ToolRegistry"
    description: "A registry mapping \"stack → quality tools\" (mutation, coverage, complexity/duplication) with run commands and a way to read the results."
  - id: "E-6"
    name: "GateResult"
    description: "The result of computing a gate: metric, threshold/baseline, pass/fail, diagnosis on failure."
  - id: "E-7"
    name: "RunReport"
    description: "The final run report: slice and Gherkin scenario statuses, gate metrics, skips and overrides, links to commits, failure diagnoses."
  - id: "E-8"
    name: "RunState"
    description: "Persistent state of an unfinished run: current slice, role, iteration, checksums of input artifacts."

success_criteria:
  - id: "SC-001"
    description: "In a project on a supported stack, initialization from the command call to a ready config takes a single interview of no more than 10 questions."
    measurable_via: "Run /bob-init on reference projects (C#, TS, Python); count interview questions."
  - id: "SC-002"
    description: "A feature is implemented by the pipeline such that the human interacts only with Gherkin specs and the final report — code is never shown to the human during a run."
    measurable_via: "Audit of the run transcript: list of all points of user interaction."
  - id: "SC-003"
    description: "No slice with an unpassed gate ever makes it into the final merge."
    measurable_via: "Test runs with deliberately failing slices: verify their changes are absent from the final branch."
  - id: "SC-004"
    description: "Per-feature role skipping reduces run time and cost proportionally: skipped roles do not run and do not spend tokens."
    measurable_via: "Compare the number of subagents run and tokens spent between runs with and without skips."
  - id: "SC-005"
    description: "A night run of a multi-slice feature completes with not a single interactive question and produces a summary report by morning."
    measurable_via: "A night e2e run on a reference project: verify the absence of input-wait pauses and the presence of a report."
  - id: "SC-006"
    description: "Every role's contribution to every slice is recoverable from the git history of any run."
    measurable_via: "Check the commit history of a reference run: each handoff is a separate commit tagged with a role."
  - id: "SC-007"
    description: "The plugin works equally well in projects with and without yamlkit."
    measurable_via: "Two e2e runs: a project with spec artifacts and a clean project with a free-text description."
  - id: "SC-008"
    description: "A colleague installs the plugin and brings their project to its first successful run without the author's help."
    measurable_via: "Field test: a second person installs the plugin following the README, time to first green run is measured."

assumptions:
  - id: "A-1"
    description: "The plugin runs inside Claude Code with access to subagents (Agent tool), git, and the project's file system."
  - id: "A-2"
    description: "The user's project is under git, or the user agrees to initialize it."
  - id: "A-3"
    description: "Sonnet- and haiku-tier models are available in the user's session; if unavailable, a role falls back to the session's model."
  - id: "A-4"
    description: "The reference flow is Uncle Bob's public material on SwarmForge (6 roles, gauntlet instead of review, \"I don't read the agents' code\"); literal compatibility with SwarmForge (tmux) is not required."
  - id: "A-5"
    description: "Patterns from model-tiered-team-kit (agent templates with placeholders, the worktree-merge protocol, per-role memory) are available as a reference during implementation."
  - id: "A-6"
    description: "The /bob-init interview and /bob-config discussions are conducted in the user's language; pipeline artifacts (Gherkin, reports) are in the language selected in the config."
