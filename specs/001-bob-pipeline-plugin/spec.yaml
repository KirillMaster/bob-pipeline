feature: "bob-pipeline — Claude Code plugin: конвейер разработки по флоу Uncle Bob"
branch: "master"
created: "2026-07-29"
status: "Draft"
input: "Плагин Claude Code «bob-pipeline»: конвейер разработки по флоу Uncle Bob (SwarmForge) — 6 ролей-субагентов (Specifier, Coder, Cleaner, Architect, Hardener, QA) вместо код-ревью человеком, «гаунтлет тестов» как гейт качества. Двухрежимный (standalone и поверх yamlkit-артефактов), конфиг через интервью на /bob-init, per-feature override пропуска шагов, гейты человека конфигурируемы (дефолт: аппрув Gherkin+QA-сценариев до кода + финальный QA-отчёт), модели per-role, один worktree на прогон + коммит роли перед handoff, стек-адаптация через реестр тулов с fallback-ресёрчем, Gherkin как документ с трассировкой (BDD-фреймворк опционально), автопочинка на месте + возврат по конвейеру только при семантических провалах (лимит 3), ночной режим, параллельные срезы, /bob-config. v1 включает всё."

user_stories:
  - id: "US1"
    title: "Установка и настройка конвейера в проекте (/bob-init)"
    priority: "P1"
    description: "Разработчик устанавливает плагин в проект и одной командой /bob-init проходит короткое интервью: плагин сканирует проект, определяет технологический стек, подбирает инструменты качества (mutation, coverage, дублирование/сложность) из реестра, разворачивает шесть ролей-агентов, адаптированных под домен и стек проекта, и фиксирует все решения в конфигурационном файле."
    motivation:
      problem: "Дисциплинированный AI-флоу (TDD, гаунтлет тестов, роли) сегодня приходится собирать вручную под каждый проект: промпты ролей, инструменты под стек, пороги качества."
      value: "Один вызов /bob-init превращает любой проект в площадку для конвейера Боба: роли, инструменты и пороги подобраны под стек и зафиксированы воспроизводимо."
      consequence_if_skipped: "Каждый проект настраивается руками, конфигурации расходятся, коллеги не могут переиспользовать флоу."
    why_priority: "Без инициализации не работает ничего остального — это входная точка плагина."
    independent_test: "В свежем проекте с известным стеком вызвать /bob-init, ответить на вопросы интервью и убедиться, что созданы конфиг и ролевые агенты, а выбранные инструменты соответствуют стеку."
    acceptance_scenarios:
      - id: "AS-1"
        given: "Проект на C# без конфигурации bob-pipeline"
        when: "Разработчик вызывает /bob-init и отвечает на вопросы интервью"
        then: "Создан конфиг .claude/bob-pipeline.yaml с ролями, моделями, порогами и инструментами (mutation/coverage/дубликаты) для C#, и в проект развёрнуты 6 ролевых агентов, адаптированных под стек"
      - id: "AS-2"
        given: "Проект на стеке, отсутствующем в реестре инструментов"
        when: "Разработчик вызывает /bob-init"
        then: "Плагин ищет подходящие инструменты в интернете, предлагает найденное разработчику на подтверждение и фиксирует выбор в конфиге; для категорий без найденного инструмента шаг помечается отключённым с явным предупреждением"
      - id: "AS-3"
        given: "Проект с уже существующим конфигом bob-pipeline"
        when: "Разработчик повторно вызывает /bob-init"
        then: "Плагин показывает существующий конфиг и спрашивает, пересоздать или оставить; молча ничего не перезаписывает"
    acceptance_criteria:
      - id: "AC-1"
        description: "После /bob-init в проекте существует машиночитаемый конфиг со списком включённых ролей, моделью на роль, порогами гейтов и выбранными инструментами качества"
        done: false
      - id: "AC-2"
        description: "Ролевые агенты развёрнуты в проект с подставленными значениями проекта (название, домен, стек) вместо плейсхолдеров"
        done: false
      - id: "AC-3"
        description: "Для стеков из реестра (C#, TS/JS, Python, Java) инструменты подобраны без обращения в интернет"
        done: false
      - id: "AC-4"
        description: "Повторный запуск /bob-init не перезаписывает существующую конфигурацию без явного подтверждения"
        done: false
    test_scenarios:
      - id: "TS-1"
        given:
          - "Свежий C#-проект с csproj и тестовым проектом"
        when: "Выполнен /bob-init с ответами интервью по умолчанию"
        then:
          - "Конфиг создан и проходит валидацию структуры"
          - "В конфиге для C# выбраны инструменты mutation и coverage из реестра"
          - "Развёрнуто 6 ролевых агентов без оставшихся плейсхолдеров"
        verification:
          - "manual"
        level: "integration"
      - id: "TS-2"
        given:
          - "Проект на экзотическом стеке (нет в реестре)"
        when: "Выполнен /bob-init"
        then:
          - "Предложены найденные в интернете инструменты либо шаг помечен отключённым с предупреждением"
        verification:
          - "manual"
        level: "e2e"

  - id: "US2"
    title: "Прогон фичи через конвейер (/bob-run, standalone)"
    priority: "P1"
    description: "Разработчик описывает фичу текстом и вызывает /bob-run. Specifier превращает описание в Gherkin-спецификации, QA-сценарии и нарезку на срезы поведения; после аппрува человека каждый срез последовательно проходит роли Coder (TDD) → Cleaner (рефакторинг) → Architect (границы/зависимости) → Hardener (mutation-гаунтлет) → QA (исполняемые проверки). Код человеку не показывается; каждая роль коммитит результат перед передачей следующей."
    motivation:
      problem: "Без конвейера AI пишет код без дисциплины: нет исполняемой спецификации, нет механических гейтов качества, человек вынужден читать и ревьюить код агента, теряя весь выигрыш."
      value: "Человек утверждает только намерение (Gherkin) и получает финальный QA-отчёт; качество кода гарантируется гаунтлетом тестов и метрик, а не глазами."
      consequence_if_skipped: "Плагин не выполняет свою основную функцию — это ядро продукта."
    why_priority: "Основной сценарий использования, ради которого существует плагин."
    independent_test: "В инициализированном проекте запустить /bob-run с описанием небольшой фичи, утвердить Gherkin, дождаться финального QA-отчёта и убедиться, что все гейты пройдены, а в истории git есть коммит каждой роли."
    acceptance_scenarios:
      - id: "AS-1"
        given: "Инициализированный проект и текстовое описание фичи"
        when: "Разработчик вызывает /bob-run с описанием"
        then: "Specifier предъявляет Gherkin-спеки, QA-сценарии и нарезку на срезы на утверждение до начала кодирования"
      - id: "AS-2"
        given: "Утверждённые Gherkin-спеки и нарезка"
        when: "Конвейер исполняет срез"
        then: "Роли проходят последовательно (Coder → Cleaner → Architect → Hardener → QA), каждая роль завершает работу коммитом с меткой роли, прогон идёт в изолированном worktree и не трогает рабочую копию разработчика"
      - id: "AS-3"
        given: "Все срезы прошли гейты"
        when: "Конвейер завершается"
        then: "Разработчик получает финальный QA-отчёт (статусы сценариев, метрики гейтов, ссылки на коммиты ролей) и изменения смержены из worktree в фичевую ветку"
      - id: "AS-4"
        given: "Разработчик отклонил Gherkin-спеки на гейте"
        when: "Он оставляет замечания"
        then: "Specifier перерабатывает спеки с учётом замечаний и предъявляет заново; код не пишется до аппрува"
    acceptance_criteria:
      - id: "AC-1"
        description: "До аппрува Gherkin ни одна строка кода реализации не создаётся"
        done: false
      - id: "AC-2"
        description: "Каждая роль оставляет отдельный коммит перед handoff — по истории git восстановим вклад каждой роли"
        done: false
      - id: "AC-3"
        description: "Прогон идёт в отдельном worktree; рабочая копия разработчика не изменяется до финального merge"
        done: false
      - id: "AC-4"
        description: "Финальный QA-отчёт содержит статус каждого Gherkin-сценария, значения метрик гейтов по срезам и итог прогона"
        done: false
      - id: "AC-5"
        description: "Acceptance-тесты трассируются на Gherkin-сценарии (тег или имя), покрытие сценариев тестами — 100% утверждённых сценариев"
        done: false
    test_scenarios:
      - id: "TS-1"
        given:
          - "Инициализированный тестовый проект"
          - "Описание фичи из 2–3 сценариев поведения"
        when: "Выполнен полный прогон /bob-run с аппрувом Gherkin"
        then:
          - "В истории git присутствуют коммиты всех включённых ролей"
          - "QA-отчёт выдан, все сценарии зелёные"
          - "Рабочая копия до merge не менялась"
        verification:
          - "manual"
        level: "e2e"
      - id: "TS-2"
        given:
          - "Gherkin отклонён с замечанием"
        when: "Specifier перерабатывает спеку"
        then:
          - "Новая версия учитывает замечание"
          - "Код до повторного аппрува не создан"
        verification:
          - "manual"
        level: "integration"

  - id: "US3"
    title: "Интеграция с yamlkit (режим поверх spec-артефактов)"
    priority: "P2"
    description: "В проекте, где фича уже проведена через yamlkit (spec/plan/tasks), /bob-run автоматически обнаруживает артефакты: спецификация становится входом Specifier'а (Gherkin генерится из неё, а не из свободного текста), нарезка на срезы берётся из tasks, и конвейер исполняет срезы вместо стандартного yamlkit-implement."
    motivation:
      problem: "Команды, работающие по spec-driven флоу, уже имеют спецификацию и задачи — заставлять Specifier заново придумывать нарезку значит дублировать работу и плодить расхождения."
      value: "Один источник истины: spec-артефакты порождают Gherkin и срезы, конвейер Боба становится дисциплиной исполнения внутри привычного флоу."
      consequence_if_skipped: "Два несвязанных флоу в одном проекте: спека отдельно, конвейер отдельно, ручная синхронизация."
    why_priority: "Ценно для существующих yamlkit-проектов пользователя, но standalone-режим самодостаточен."
    independent_test: "В проекте с готовыми spec.yaml/tasks.yaml вызвать /bob-run без описания фичи и убедиться, что Gherkin сгенерён из спеки, а срезы совпадают с задачами."
    acceptance_scenarios:
      - id: "AS-1"
        given: "Проект с фичевой директорией yamlkit (spec и tasks присутствуют)"
        when: "Разработчик вызывает /bob-run"
        then: "Плагин автоматически определяет режим интеграции, строит Gherkin из спецификации и формирует срезы из задач; свободное описание фичи не запрашивается"
      - id: "AS-2"
        given: "Проект без yamlkit-артефактов"
        when: "Разработчик вызывает /bob-run с текстовым описанием"
        then: "Плагин работает в standalone-режиме без каких-либо требований к наличию yamlkit"
      - id: "AS-3"
        given: "Проект с частичными артефактами (есть спецификация, нет задач)"
        when: "Разработчик вызывает /bob-run"
        then: "Gherkin строится из спецификации, а нарезку на срезы выполняет Specifier и предъявляет на том же гейте аппрува"
    acceptance_criteria:
      - id: "AC-1"
        description: "Режим (standalone/интеграция) определяется автоматически по наличию артефактов, без флага пользователя"
        done: false
      - id: "AC-2"
        description: "В режиме интеграции каждый Gherkin-сценарий трассируется на требование спецификации, а каждый срез — на задачу"
        done: false
      - id: "AC-3"
        description: "Плагин полностью работоспособен в проекте, где yamlkit не установлен"
        done: false
    test_scenarios:
      - id: "TS-1"
        given:
          - "Проект с готовыми spec- и tasks-артефактами yamlkit"
        when: "Выполнен /bob-run"
        then:
          - "Срезы конвейера соответствуют задачам из tasks"
          - "Gherkin ссылается на требования спеки"
        verification:
          - "manual"
        level: "e2e"

  - id: "US4"
    title: "Пропуск шагов и переопределение конфигурации per-feature"
    priority: "P2"
    description: "Перед запуском фичи разработчик явно указывает, какие роли пропустить («пропусти Hardener и Architect») или какие параметры переопределить; конвейер исполняет только оставшиеся роли, фиксируя отклонение от базового конфига в отчёте."
    motivation:
      problem: "Не каждая фича требует полного гаунтлета: для мелочи mutation-testing и архитектурное ревью — лишние время и токены (сам Боб: «часто я использую только unit-тесты»)."
      value: "Гибкая калибровка строгости под критичность задачи одним аргументом, без правки базового конфига."
      consequence_if_skipped: "Либо полный конвейер всегда (дорого и медленно), либо ручная правка конфига туда-сюда."
    why_priority: "Ключевое требование пользователя, но работает поверх готового конвейера."
    independent_test: "Запустить /bob-run с указанием пропустить две роли и убедиться, что они не исполнялись, а отчёт фиксирует пропуск."
    acceptance_scenarios:
      - id: "AS-1"
        given: "Инициализированный проект"
        when: "Разработчик вызывает /bob-run с указанием пропустить Hardener"
        then: "Роль Hardener не исполняется, её коммитов и гейтов нет, финальный отчёт явно перечисляет пропущенные роли"
      - id: "AS-2"
        given: "Запрос на пропуск обязательной роли (Coder)"
        when: "Разработчик вызывает /bob-run"
        then: "Плагин отказывает с объяснением, какие роли неотключаемы (Specifier и Coder), и не запускает прогон"
    acceptance_criteria:
      - id: "AC-1"
        description: "Пропущенные роли не исполняются и не потребляют токены"
        done: false
      - id: "AC-2"
        description: "Отчёт прогона содержит список пропущенных ролей и переопределённых параметров"
        done: false
      - id: "AC-3"
        description: "Specifier и Coder пропустить нельзя; попытка отклоняется с объяснением"
        done: false
    test_scenarios:
      - id: "TS-1"
        given:
          - "Инициализированный проект"
        when: "Выполнен /bob-run с пропуском Hardener и QA"
        then:
          - "В истории коммитов нет коммитов Hardener/QA"
          - "Отчёт перечисляет пропуски"
        verification:
          - "manual"
        level: "integration"

  - id: "US5"
    title: "Гейты человека и ночной автономный режим"
    priority: "P2"
    description: "По умолчанию конвейер останавливается дважды: аппрув Gherkin+QA-сценариев до кода и финальный QA-отчёт. Состав гейтов настраивается в конфиге. В ночном режиме конвейер работает без единого интерактивного вопроса: гейты отключены, провалившийся срез помечается и пропускается, утром разработчик получает сводный отчёт по всем срезам."
    motivation:
      problem: "Днём нужен контроль намерения, ночью конвейер должен работать автономно — любая интерактивная пауза убивает ночной прогон."
      value: "Максимальная автономность без потери контроля: человек управляет намерением и видит итог, конвейер работает пока разработчик спит."
      consequence_if_skipped: "Конвейер простаивает ночью или встаёт колом на первом вопросе; либо наоборот — нет контроля намерения днём."
    why_priority: "Автономность — вторая по важности ценность флоу Боба после гаунтлета."
    independent_test: "Запустить прогон в ночном режиме на фиче с заведомо провальным срезом и убедиться, что прогон дошёл до конца без вопросов, а утренний отчёт содержит статусы всех срезов включая провалившийся."
    acceptance_scenarios:
      - id: "AS-1"
        given: "Конфиг с гейтами по умолчанию"
        when: "Идёт обычный прогон"
        then: "Конвейер останавливается ровно два раза: аппрув Gherkin до кода и финальный отчёт"
      - id: "AS-2"
        given: "Прогон запущен в ночном режиме"
        when: "Конвейер исполняет все срезы"
        then: "Ни одного интерактивного вопроса не задаётся; Gherkin-гейт заменяется автоаппрувом с пометкой в отчёте"
      - id: "AS-3"
        given: "В ночном прогоне срез исчерпал лимит итераций"
        when: "Гейт остаётся непройденным"
        then: "Срез помечается как провалившийся, его изменения не попадают в merge, конвейер переходит к следующему независимому срезу, утренний отчёт содержит диагноз"
    acceptance_criteria:
      - id: "AC-1"
        description: "Дефолтная конфигурация даёт ровно два гейта: Gherkin-аппрув и финальный отчёт"
        done: false
      - id: "AC-2"
        description: "Ночной режим не задаёт ни одного интерактивного вопроса за весь прогон"
        done: false
      - id: "AC-3"
        description: "Провал среза ночью не валит прогон: срез помечен, независимые срезы исполнены, сводный отчёт выдан"
        done: false
      - id: "AC-4"
        description: "Изменения провалившегося среза не попадают в итоговый merge"
        done: false
    test_scenarios:
      - id: "TS-1"
        given:
          - "Фича с двумя независимыми срезами, один из которых заведомо провальный"
        when: "Ночной прогон завершён"
        then:
          - "Здоровый срез смержен, провальный — нет"
          - "Сводный отчёт содержит оба статуса и диагноз провала"
        verification:
          - "manual"
        level: "e2e"

  - id: "US6"
    title: "Гаунтлет качества: автопочинка, возвраты и пороги"
    priority: "P1"
    description: "Каждая роль-проверяющий чинит на месте то, что в её компетенции (Hardener сам добивает выживших мутантов тестами, Cleaner сам чистит), а назад по конвейеру возвращает только семантические провалы: упавший QA-сценарий → Coder, забракованная структура → Cleaner/Coder. Возвраты ограничены лимитом итераций; пороги гейтов: mutation score не ниже порога (дефолт 80%), coverage — информационно, сложность/дублирование — не хуже базовой линии."
    motivation:
      problem: "Без механических гейтов «код никто не читает» превращается в «качество никто не контролирует»; без лимитов агенты бесконечно жуют собственное месиво."
      value: "Качество гарантируется исполняемым гаунтлетом с измеримыми порогами; циклы починки сходятся или честно останавливаются с диагнозом."
      consequence_if_skipped: "Флоу Боба теряет несущую конструкцию — доверие к коду без ревью человеком не обосновано ничем."
    why_priority: "Гаунтлет — та самая замена код-ревью, ядро методики."
    independent_test: "Подсунуть срез со слабыми тестами и убедиться, что Hardener добил mutation score до порога сам; подсунуть срез с неверным поведением и убедиться, что после провала QA работа вернулась Coder'у и цикл ограничен лимитом."
    acceptance_scenarios:
      - id: "AS-1"
        given: "После Coder'а выжили мутанты (score ниже порога)"
        when: "Работает Hardener"
        then: "Hardener сам дописывает тесты до достижения порога, не возвращая работу Coder'у"
      - id: "AS-2"
        given: "QA-сценарий упал (поведение неверно)"
        when: "QA фиксирует провал"
        then: "Срез возвращается Coder'у с диагнозом; после починки срез повторно проходит последующие роли"
      - id: "AS-3"
        given: "Срез вернулся на починку максимальное число раз (дефолт 3)"
        when: "Гейт снова не пройден"
        then: "Конвейер останавливает срез и выдаёт отчёт с диагнозом (в ночном режиме — помечает срез и продолжает)"
      - id: "AS-4"
        given: "Cleaner ухудшил метрику сложности относительно базовой линии"
        when: "Считается гейт «не хуже базы»"
        then: "Гейт не пройден, Cleaner дочищает на месте"
    acceptance_criteria:
      - id: "AC-1"
        description: "Выжившие мутанты устраняются Hardener'ом на месте без возврата по конвейеру"
        done: false
      - id: "AC-2"
        description: "Возврат по конвейеру происходит только при семантических провалах (QA-fail, Architect-fail), маршруты возврата определены в конфиге"
        done: false
      - id: "AC-3"
        description: "Число возвратов на срез ограничено настраиваемым лимитом (дефолт 3); превышение — стоп с диагнозом"
        done: false
      - id: "AC-4"
        description: "Гейты считаются механически: mutation score ≥ порога, сложность/дублирование не хуже базовой линии; coverage выводится информационно и прогон не блокирует"
        done: false
    test_scenarios:
      - id: "TS-1"
        given:
          - "Срез с тестами, пропускающими мутантов"
        when: "Hardener завершил работу"
        then:
          - "Mutation score не ниже порога"
          - "Возвратов Coder'у не было"
        verification:
          - "manual"
        level: "integration"
      - id: "TS-2"
        given:
          - "Срез с неверным поведением, которое Coder не может починить"
        when: "Исчерпан лимит возвратов"
        then:
          - "Прогон среза остановлен с диагнозом, бесконечного цикла нет"
        verification:
          - "manual"
        level: "integration"

  - id: "US7"
    title: "Параллельные срезы"
    priority: "P3"
    description: "Независимые срезы фичи (без взаимных зависимостей) исполняются одновременно, каждый в собственном worktree-конвейере, с последовательным merge результатов по протоколу; зависимые срезы ждут своих предшественников."
    motivation:
      problem: "Последовательный прогон длинной фичи из независимых кусков занимает сумму времён всех срезов, хотя срезы не мешают друг другу."
      value: "Время прогона фичи приближается ко времени самого долгого среза, а не суммы всех."
      consequence_if_skipped: "Ночной прогон может не успеть за ночь; конвейер проигрывает по скорости оригинальной схеме Боба."
    why_priority: "Оптимизация скорости; корректность конвейера от неё не зависит."
    independent_test: "Фича с двумя независимыми срезами: убедиться, что срезы шли одновременно (пересечение интервалов исполнения), оба результата смержены без потерь."
    acceptance_scenarios:
      - id: "AS-1"
        given: "Нарезка с независимыми срезами и включённый параллелизм"
        when: "Запущен прогон"
        then: "Независимые срезы исполняются одновременно в отдельных worktree, число одновременных конвейеров ограничено настройкой"
      - id: "AS-2"
        given: "Срез B зависит от среза A"
        when: "Планируется исполнение"
        then: "B не стартует до успешного merge A"
      - id: "AS-3"
        given: "Merge параллельного среза даёт конфликт"
        when: "Выполняется слияние"
        then: "Конфликт разрешается по протоколу слияния; при неразрешимости срез помечается на ручное слияние в отчёте, чужие срезы не страдают"
    acceptance_criteria:
      - id: "AC-1"
        description: "Зависимости между срезами соблюдаются: зависимый срез никогда не стартует раньше успешного завершения предшественника"
        done: false
      - id: "AC-2"
        description: "Число одновременных конвейеров ограничено настраиваемым лимитом"
        done: false
      - id: "AC-3"
        description: "Неразрешимый конфликт слияния не роняет прогон: срез помечается, остальные завершаются"
        done: false
    test_scenarios:
      - id: "TS-1"
        given:
          - "Фича с двумя независимыми срезами"
        when: "Прогон с включённым параллелизмом завершён"
        then:
          - "Интервалы исполнения срезов пересекаются"
          - "Оба среза смержены, результат целостен"
        verification:
          - "manual"
        level: "e2e"

  - id: "US8"
    title: "Управление конфигурацией (/bob-config)"
    priority: "P3"
    description: "Разработчик в любой момент вызывает /bob-config, чтобы обсудить и изменить зафиксированные решения: заменить инструмент качества, поменять пороги, модели ролей, состав гейтов или маршруты возвратов; изменения валидируются и применяются к последующим прогонам."
    motivation:
      problem: "Замороженный на init выбор инструментов и порогов устаревает: выходят новые тулы, меняются требования к строгости."
      value: "Конфигурация живёт и меняется явным управляемым способом, а не ручной правкой YAML наугад."
      consequence_if_skipped: "Единственный путь изменения — пересоздание конфига через /bob-init или ручная правка без валидации."
    why_priority: "Удобство сопровождения; на первый прогон не влияет."
    independent_test: "Вызвать /bob-config, заменить mutation-инструмент и порог, убедиться, что следующий прогон использует новые значения."
    acceptance_scenarios:
      - id: "AS-1"
        given: "Инициализированный проект"
        when: "Разработчик вызывает /bob-config и просит заменить mutation-инструмент"
        then: "Плагин обсуждает варианты, применяет выбор в конфиг и подтверждает изменение; следующий прогон использует новый инструмент"
      - id: "AS-2"
        given: "Запрошено невалидное изменение (порог вне диапазона, неизвестная роль)"
        when: "Изменение применяется"
        then: "Плагин отклоняет изменение с объяснением, конфиг остаётся валидным"
    acceptance_criteria:
      - id: "AC-1"
        description: "Изменения через /bob-config применяются к последующим прогонам без пересоздания конфига"
        done: false
      - id: "AC-2"
        description: "Невалидные изменения отклоняются с объяснением, конфиг никогда не остаётся в невалидном состоянии"
        done: false
    test_scenarios:
      - id: "TS-1"
        given:
          - "Проект с конфигом по умолчанию"
        when: "Через /bob-config изменён порог mutation score"
        then:
          - "Конфиг валиден и содержит новый порог"
          - "Следующий прогон применяет новый порог"
        verification:
          - "manual"
        level: "integration"

edge_cases:
  - id: "EC-1"
    description: "Проект без тестовой инфраструктуры (нет тестового фреймворка/проекта)"
    expected_behavior: "/bob-init обнаруживает отсутствие и предлагает завести тестовую инфраструктуру как часть инициализации; /bob-run без неё отказывается стартовать с объяснением"
  - id: "EC-2"
    description: "Для стека нет mutation-инструмента даже после ресёрча"
    expected_behavior: "Роль Hardener деградирует до усиления тестов по эвристикам (граничные значения, негативные кейсы) с явной пометкой в конфиге и отчёте, что mutation-гейт недоступен"
  - id: "EC-3"
    description: "Грязная рабочая копия (незакоммиченные изменения) на момент /bob-run"
    expected_behavior: "Прогон стартует, так как работает в отдельном worktree от последнего коммита ветки; пользователь предупреждается, что незакоммиченные изменения в прогон не попадут"
  - id: "EC-4"
    description: "Проект не является git-репозиторием"
    expected_behavior: "/bob-run отказывается стартовать с объяснением (worktree и аудит-трейл требуют git); /bob-init предлагает инициализировать репозиторий"
  - id: "EC-5"
    description: "Прогон прерван на середине (сессия оборвалась, лимиты, ошибка)"
    expected_behavior: "Состояние прогона (текущий срез, роль, итерация) фиксируется в файле состояния внутри worktree; повторный /bob-run обнаруживает незавершённый прогон и предлагает продолжить с последнего коммита роли или отбросить"
  - id: "EC-6"
    description: "Gherkin-гейт: пользователь не отвечает, а режим не ночной"
    expected_behavior: "Конвейер ждёт ответа; никакого таймаут-автоаппрува в дневном режиме нет"
  - id: "EC-7"
    description: "Базовая линия метрик отсутствует (первый прогон в проекте)"
    expected_behavior: "Первый прогон фиксирует базовую линию по состоянию до изменений и оценивает «не хуже базы» относительно неё"
  - id: "EC-8"
    description: "Переопределение per-feature противоречит конфигу (роль уже выключена глобально, а её просят пропустить)"
    expected_behavior: "Прогон идёт, дублирование отмечается в отчёте без ошибки"
  - id: "EC-9"
    description: "В режиме интеграции yamlkit-артефакты изменились между аппрувом Gherkin и исполнением"
    expected_behavior: "Конвейер обнаруживает расхождение по контрольной сумме входных артефактов и требует повторного аппрува затронутых срезов"

functional_requirements:
  - id: "FR-001"
    text: "Плагин MUST предоставлять команду инициализации, которая сканирует проект, определяет технологический стек и через интервью с пользователем создаёт машиночитаемый конфиг конвейера (роли, модели, гейты, пороги, инструменты, режимы)."
    story_refs:
      - "US1"
  - id: "FR-002"
    text: "Плагин MUST содержать реестр инструментов качества (mutation, coverage, сложность/дублирование) минимум для C#, TypeScript/JavaScript, Python и Java и выбирать инструменты из реестра без обращения в интернет."
    story_refs:
      - "US1"
  - id: "FR-003"
    text: "WHEN стек проекта отсутствует в реестре, плагин MUST выполнить поиск подходящих инструментов в интернете, предложить результат пользователю на подтверждение и зафиксировать выбор в конфиге; при отсутствии инструмента категория помечается отключённой с предупреждением."
    story_refs:
      - "US1"
  - id: "FR-004"
    text: "Плагин MUST развёртывать шесть ролевых агентов (Specifier, Coder, Cleaner, Architect, Hardener, QA) с промптами, адаптированными под название, домен и стек проекта."
    story_refs:
      - "US1"
      - "US2"
  - id: "FR-005"
    text: "Команда прогона MUST до начала кодирования предъявить пользователю Gherkin-спецификации, QA-сценарии и нарезку на срезы и ждать явного аппрува (кроме ночного режима); при отклонении Specifier MUST переработать артефакты с учётом замечаний."
    story_refs:
      - "US2"
      - "US5"
  - id: "FR-006"
    text: "Конвейер MUST исполнять каждый срез последовательностью включённых ролей, где каждая роль стартует субагентом с чистым контекстом и MUST завершать работу git-коммитом с меткой роли перед передачей следующей."
    story_refs:
      - "US2"
  - id: "FR-007"
    text: "Прогон фичи MUST исполняться в отдельном git worktree; рабочая копия пользователя не изменяется до финального merge, выполняемого по протоколу слияния."
    story_refs:
      - "US2"
      - "US7"
  - id: "FR-008"
    text: "Acceptance-тесты MUST трассироваться на Gherkin-сценарии через тег или имя; по умолчанию Gherkin — человекочитаемый документ, а тесты пишутся штатным тест-фреймворком проекта; полноценный BDD-фреймворк подключается опцией конфига."
    story_refs:
      - "US2"
  - id: "FR-009"
    text: "WHEN в проекте обнаружены spec-артефакты yamlkit для текущей фичи, плагин MUST автоматически перейти в режим интеграции: Gherkin генерируется из спецификации, срезы берутся из задач; WHEN артефактов нет — работать standalone от текстового описания."
    story_refs:
      - "US3"
  - id: "FR-010"
    text: "Плагин MUST принимать при запуске прогона явное перечисление ролей для пропуска и параметров для переопределения; Specifier и Coder MUST быть неотключаемыми; все отклонения от базового конфига MUST фиксироваться в отчёте."
    story_refs:
      - "US4"
  - id: "FR-011"
    text: "Модель исполнения каждой роли MUST задаваться в конфиге per-role (дефолт: Specifier/Coder/Cleaner/Architect — sonnet, Hardener/QA — haiku) и передаваться субагенту явно при запуске."
    story_refs:
      - "US1"
      - "US2"
  - id: "FR-012"
    text: "Плагин MUST поддерживать ночной режим: ни одного интерактивного вопроса за прогон, автоаппрув Gherkin с пометкой, провалившиеся срезы помечаются и пропускаются, по завершении формируется сводный отчёт по всем срезам."
    story_refs:
      - "US5"
  - id: "FR-013"
    text: "Роли-проверяющие MUST чинить на месте дефекты своей компетенции (Hardener — добивать выживших мутантов тестами, Cleaner — дочищать метрики); возврат среза назад по конвейеру допускается только при семантических провалах по маршрутам из конфига (дефолт: QA-fail → Coder, Architect-fail → Cleaner/Coder)."
    story_refs:
      - "US6"
  - id: "FR-014"
    text: "Число возвратов среза MUST ограничиваться настраиваемым лимитом (дефолт 3); при исчерпании конвейер MUST остановить срез с диагнозом (в ночном режиме — пометить и продолжить остальные)."
    story_refs:
      - "US6"
      - "US5"
  - id: "FR-015"
    text: "Гейты качества MUST вычисляться механически из выводов инструментов: mutation score не ниже настраиваемого порога (дефолт 80%), метрики сложности/дублирования не хуже базовой линии; coverage MUST выводиться информационно и не блокировать прогон."
    story_refs:
      - "US6"
  - id: "FR-016"
    text: "Финальный QA-отчёт MUST включать статус каждого Gherkin-сценария, значения метрик гейтов по срезам, список пропущенных ролей и переопределений, ссылки на коммиты ролей и итоговый статус прогона."
    story_refs:
      - "US2"
      - "US4"
      - "US5"
  - id: "FR-017"
    text: "WHEN параллелизм включён, независимые срезы MUST исполняться одновременно в отдельных worktree-конвейерах с настраиваемым лимитом одновременности; зависимые срезы MUST ждать успешного merge предшественников; неразрешимый конфликт слияния MUST помечать срез без срыва остальных."
    story_refs:
      - "US7"
  - id: "FR-018"
    text: "Плагин MUST предоставлять команду управления конфигурацией, позволяющую обсуждать и менять инструменты, пороги, модели, гейты и маршруты возвратов с валидацией; невалидные изменения MUST отклоняться с объяснением."
    story_refs:
      - "US8"
  - id: "FR-019"
    text: "Состояние прогона (срез, роль, итерация) MUST персистироваться; WHEN прогон прерван, повторный запуск MUST предложить продолжение с последнего коммита роли либо отбрасывание прогона."
    story_refs:
      - "US2"
      - "US5"
  - id: "FR-020"
    text: "Плагин MUST распространяться как единый устанавливаемый пакет плагина Claude Code (команды, агенты, шаблоны, реестр) без ручного копирования файлов получателем."
    story_refs:
      - "US1"

key_entities:
  - id: "E-1"
    name: "PipelineConfig"
    description: "Машиночитаемая конфигурация конвейера в проекте: включённые роли, модель per-role, гейты человека, пороги качества, выбранные инструменты, маршруты возвратов, лимиты итераций и параллелизма, режимы (ночной, BDD)."
  - id: "E-2"
    name: "Role"
    description: "Одна из шести ролей конвейера (Specifier, Coder, Cleaner, Architect, Hardener, QA): промпт-шаблон, зона ответственности, критерии завершения, модель исполнения."
  - id: "E-3"
    name: "Slice"
    description: "Срез поведения — единица прохода через конвейер: связанная группа Gherkin-сценариев, зависимости от других срезов, статус, счётчик возвратов, ссылки на коммиты ролей."
  - id: "E-4"
    name: "GherkinSpec"
    description: "Человекочитаемая спецификация поведения фичи (сценарии Given/When/Then) с трассировкой на требования исходной спеки (в режиме интеграции) и на acceptance-тесты."
  - id: "E-5"
    name: "ToolRegistry"
    description: "Реестр соответствия «стек → инструменты качества» (mutation, coverage, сложность/дублирование) с командами запуска и способом чтения результатов."
  - id: "E-6"
    name: "GateResult"
    description: "Результат вычисления гейта: метрика, порог/базовая линия, факт прохождения, диагноз при провале."
  - id: "E-7"
    name: "RunReport"
    description: "Итоговый отчёт прогона: статусы срезов и Gherkin-сценариев, метрики гейтов, пропуски и переопределения, ссылки на коммиты, диагнозы провалов."
  - id: "E-8"
    name: "RunState"
    description: "Персистентное состояние незавершённого прогона: текущий срез, роль, итерация, контрольные суммы входных артефактов."

success_criteria:
  - id: "SC-001"
    description: "В проекте на поддерживаемом стеке инициализация от вызова команды до готового конфига занимает одно интервью не длиннее 10 вопросов."
    measurable_via: "Прогон /bob-init на эталонных проектах (C#, TS, Python); подсчёт вопросов интервью."
  - id: "SC-002"
    description: "Фича реализуется конвейером так, что человек взаимодействует только с Gherkin-спеками и финальным отчётом — ни одного показа кода человеку за прогон."
    measurable_via: "Аудит транскрипта прогона: перечень всех точек взаимодействия с пользователем."
  - id: "SC-003"
    description: "Ни один срез с непройденным гейтом не попадает в итоговый merge."
    measurable_via: "Тестовые прогоны с заведомо провальными срезами: проверка отсутствия их изменений в итоговой ветке."
  - id: "SC-004"
    description: "Пропуск ролей per-feature сокращает время и стоимость прогона пропорционально: пропущенные роли не запускаются и не тратят токены."
    measurable_via: "Сравнение числа запущенных субагентов и токенов прогона с пропусками и без."
  - id: "SC-005"
    description: "Ночной прогон фичи из нескольких срезов завершается без единого интерактивного вопроса и к утру даёт сводный отчёт."
    measurable_via: "Ночной e2e-прогон на эталонном проекте: проверка отсутствия пауз ожидания ввода и наличия отчёта."
  - id: "SC-006"
    description: "По истории git любого прогона восстановим вклад каждой роли в каждый срез."
    measurable_via: "Проверка истории коммитов эталонного прогона: каждый handoff — отдельный коммит с меткой роли."
  - id: "SC-007"
    description: "Плагин одинаково работоспособен в проектах с yamlkit и без него."
    measurable_via: "Два e2e-прогона: проект с spec-артефактами и чистый проект со свободным описанием."
  - id: "SC-008"
    description: "Коллега устанавливает плагин и доводит свой проект до первого успешного прогона без помощи автора."
    measurable_via: "Полевой тест: установка плагина вторым человеком по README, замер до первого зелёного прогона."

assumptions:
  - id: "A-1"
    description: "Плагин исполняется в Claude Code с доступом к субагентам (Agent tool), git и файловой системе проекта."
  - id: "A-2"
    description: "Проект пользователя ведётся в git или пользователь согласен его инициализировать."
  - id: "A-3"
    description: "Модели уровня sonnet и haiku доступны в сессии пользователя; при недоступности роль наследует модель сессии."
  - id: "A-4"
    description: "Референс флоу — публичные материалы Uncle Bob о SwarmForge (6 ролей, гаунтлет вместо ревью, «код агентов не читаю»); буквальная совместимость с SwarmForge (tmux) не требуется."
  - id: "A-5"
    description: "Паттерны model-tiered-team-kit (шаблоны агентов с плейсхолдерами, worktree-merge протокол, per-role память) доступны как референс при реализации."
  - id: "A-6"
    description: "Интервью /bob-init и обсуждения /bob-config ведутся на языке пользователя; артефакты конвейера (Gherkin, отчёты) — на языке, выбранном в конфиге."
