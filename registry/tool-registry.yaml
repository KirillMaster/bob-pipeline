# Quality tool registry for the bob-pipeline plugin.
# One entry per (stack, category). Entries with stack "any" are the fallback
# used when no stack-specific entry exists for a category.
# report_parser names a handler implemented in scripts/parse_reports.py.
# scope_flag (mutation entries, required): flag template appended to run_command to
# restrict mutation to the slice's changed files (design D5). {file} = one file (repeat the
# flag per file), {files} = space-separated list, {classes} = comma-separated class names.
# Quality-gate categories (design D20): lint, format, architecture (blocking, fast: coder final run +
# architect), diff-coverage, constitution-traceability (blocking at the merge gate only). The
# exitcode-* parsers read a file whose first line is the tool's exit code (roles write
# `<exit>\n<output tail>` to .bob/reports/<category>-<slice>.txt). Arch tests carry Category=Architecture
# and are part of the fast suite. Mutation entries are used only with mutation.framework_enabled: true (D22).
entries:
  # ── csharp ──────────────────────────────────────────────────────
  - stack: csharp
    category: mutation
    tool: Stryker.NET
    # Scoping is mandatory, not optional: without --mutate/--test-project the run
    # defaults to the whole solution, which is both slow and gives a diluted,
    # misleading score (real incident: 11.83% whole-project vs. 100% once scoped
    # to the slice's changed files). The hardener appends scope_flag per changed file and
    # fills in <ScopedTestProject> per slice; never point --test-project at a Testcontainers-
    # based integration test project (mutant x test x container-startup hangs).
    run_command: "dotnet stryker --reporter json --test-project <ScopedTestProject> --timeout-ms 60000 --concurrency 4"
    report_parser: stryker
    scope_flag: '--mutate "{file}"'
    enabled: true
  - stack: csharp
    category: coverage
    tool: coverlet
    run_command: "dotnet test --collect:\"XPlat Code Coverage\""
    report_parser: cobertura
    enabled: true
  - stack: csharp
    category: lint
    tool: dotnet-build-analyzers
    run_command: "dotnet build -warnaserror --nologo"
    report_parser: exitcode-lint
    enabled: true
  - stack: csharp
    category: format
    tool: dotnet-format
    run_command: "dotnet format --verify-no-changes"
    report_parser: exitcode-format
    enabled: true
  - stack: csharp
    category: architecture
    # ArchUnitNET tests from KirillMaster.QualityGates.Architecture (pet remotes) or
    # TenenGroup.ArchitectureRules (remote contains tenengroup); wired by bob-init / upgrade step qg.
    tool: ArchUnitNET
    run_command: 'dotnet test --filter "Category=Architecture"'
    report_parser: exitcode-architecture
    enabled: true

  # ── typescript / javascript ─────────────────────────────────────
  - stack: typescript
    category: mutation
    tool: StrykerJS
    run_command: "npx stryker run --reporters json"
    report_parser: stryker
    scope_flag: "--mutate {files}"
    enabled: true
  - stack: typescript
    category: coverage
    tool: runner-coverage
    run_command: "npx vitest run --coverage --coverage.reporter=lcov || npx jest --coverage --coverageReporters=lcov"
    report_parser: lcov
    enabled: true
  - stack: typescript
    category: lint
    tool: tsc-eslint
    run_command: "npx tsc --noEmit && npx eslint . --max-warnings 0"
    report_parser: exitcode-lint
    enabled: true
  - stack: typescript
    category: format
    tool: prettier
    run_command: "npx prettier --check ."
    report_parser: exitcode-format
    enabled: true

  # ── python ──────────────────────────────────────────────────────
  - stack: python
    category: mutation
    tool: mutmut
    run_command: "python -m mutmut run"
    report_parser: mutmut
    scope_flag: "--paths-to-mutate {files}"
    enabled: true
  - stack: python
    category: coverage
    tool: coverage.py
    run_command: "python -m coverage run -m pytest && python -m coverage xml"
    report_parser: cobertura
    enabled: true
  - stack: python
    category: lint
    tool: ruff
    run_command: "python -m ruff check ."
    report_parser: exitcode-lint
    enabled: true
  - stack: python
    category: format
    tool: ruff-format
    run_command: "python -m ruff format --check ."
    report_parser: exitcode-format
    enabled: true

  # ── java ────────────────────────────────────────────────────────
  - stack: java
    category: mutation
    tool: PIT
    run_command: "mvn org.pitest:pitest-maven:mutationCoverage -DoutputFormats=XML"
    report_parser: pit
    scope_flag: "-DtargetClasses={classes}"
    enabled: true
  - stack: java
    category: coverage
    tool: JaCoCo
    run_command: "mvn test jacoco:report"
    report_parser: jacoco
    enabled: true

  # ── language-agnostic fallbacks ──────────────────────────────────
  - stack: any
    category: complexity
    tool: lizard
    run_command: "python -m lizard --csv ."
    report_parser: lizard
    enabled: true
  - stack: any
    category: duplication
    tool: jscpd
    run_command: "npx jscpd --reporters json --output .bob/reports ."
    report_parser: jscpd
    enabled: true
  # diff-coverage: <coverage_xml> = the cobertura file of the merge-gate coverage run, <base> = slice base branch
  - stack: any
    category: diff-coverage
    tool: diff-cover
    run_command: "python -m diff_cover.diff_cover_tool <coverage_xml> --compare-branch=<base> --json-report .bob/reports/diff-cover.json"
    report_parser: diff-cover
    enabled: true
  # constitution-traceability: no-op without .specify/memory/constitution.yaml; <green_tests> = list of passing test names
  - stack: any
    category: constitution-traceability
    tool: constitution-trace
    run_command: "python ${CLAUDE_PLUGIN_ROOT}/scripts/constitution_trace.py --constitution .specify/memory/constitution.yaml --green-tests <green_tests>"
    report_parser: constitution-trace
    enabled: true
