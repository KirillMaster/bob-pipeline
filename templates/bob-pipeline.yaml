# bob-pipeline configuration — instantiated by /bob-init into .claude/bob-pipeline.yaml
# This file is the single source of defaults (roles, models, thresholds, test commands);
# bob-init, bob-config and the docs derive from it. Change via /bob-config (validated),
# or override per run ("skip Hardener") without touching this file.
version: "1"
project_name: "{{PROJECT_NAME}}"
stack: "{{STACK}}"

# Ordered pipeline. Model is passed to the subagent as an explicit parameter
# at spawn time (frontmatter model is ignored, Claude Code bug #44385).
# specifier and coder are non-skippable: a per-run skip request for them is refused.
roles:
  - name: specifier
    model: sonnet
    enabled: true
    gates: [gherkin-traceability]
  - name: coder
    model: sonnet
    enabled: true
    gates: [tests-green, lint, format, architecture]
  # architect = behavior-preserving refactor (complexity/duplication toward baseline)
  # + module boundary review, one pass. Legacy `cleaner` is accepted and treated as architect.
  - name: architect
    model: sonnet
    enabled: true
    gates: [tests-green, lint, format, architecture, complexity-baseline, duplication-baseline]
  - name: hardener
    model: haiku
    enabled: true
    # D22: semantic analysis by default (tests vs code: missing assertions, untested branches,
    # boundaries); an unfixed finding blocks, a mutation SCORE below threshold never does.
    gates: [tests-green, hardening-findings, mutation-score]
    degradation: "no mutation tool: semantic test strengthening (boundary values, error paths, null/empty inputs); recorded as a deviation"
  - name: qa
    model: haiku
    enabled: true
    gates: [tests-green, gherkin-traceability]

# Test commands. run_command / scoped_command / coverage_command are the FAST suite and must
# exclude integration tests (per-stack exclusion below). run_command: coder's final run and the
# orchestrator's merge gate. scoped_command ({filter} = test filter expression): architect;
# absent -> build only. coverage_command: merge gate only; absent -> run_command.
# integration_command: integration suite, run exactly once by the orchestrator (no role runs it):
# in the merge gate (integration_at: merge-gate, default) or once after the last merge on the
# base branch (integration_at: run-end). Absent -> no integration run.
# Coverage is never a standalone run. Filled by /bob-init from the per-stack defaults below
# ({sln} = detected solution/project file); `#@ <stack>.<key> = <command>` lines are machine-read.
# `exclude_integration` is appended to run/coverage commands (scoped: see its own default) when
# integration tests exist; integration tests are marked Category=Integration / @pytest.mark.integration /
# an `integration` path / JUnit tag `integration`.
#@ csharp.run_command = dotnet test {sln}
#@ csharp.scoped_command = dotnet test {sln} --filter "{filter}"
#@ csharp.coverage_command = dotnet test {sln} --collect:"XPlat Code Coverage"
#@ csharp.exclude_integration = --filter "Category!=Integration"
#@ csharp.scoped_exclude_integration = --filter "({filter})&Category!=Integration"
#@ csharp.integration_command = dotnet test {sln} --filter "Category=Integration"
#@ typescript.run_command = npm test
#@ typescript.scoped_command = npm test -- {filter}
#@ typescript.coverage_command = npm test -- --coverage
#@ typescript.exclude_integration = --testPathIgnorePatterns integration
#@ typescript.integration_command = npm test -- --testPathPattern integration
#@ python.run_command = python -m pytest
#@ python.scoped_command = python -m pytest -k "{filter}"
#@ python.coverage_command = python -m pytest --cov --cov-report=xml
#@ python.exclude_integration = -m "not integration"
#@ python.integration_command = python -m pytest -m integration
#@ java.run_command = mvn test
#@ java.scoped_command = mvn test -Dtest="{filter}"
#@ java.coverage_command = mvn test jacoco:report
#@ java.exclude_integration = -DexcludedGroups=integration
#@ java.integration_command = mvn test -Dgroups=integration
tests:
  run_command: '{{TESTS_RUN_COMMAND}}'
  scoped_command: '{{TESTS_SCOPED_COMMAND}}'
  coverage_command: '{{TESTS_COVERAGE_COMMAND}}'
  # integration_command: '<integration suite>'   # bob-init uncomments when integration tests are detected
  # integration_at: merge-gate                   # merge-gate | run-end

# Frozen tool selection — filled by /bob-init from registry/tool-registry.yaml
# (or from confirmed web research for stacks outside the registry).
tools: {{TOOLS}}

human_gates:
  gherkin_approval: true   # approve Gherkin + QA procedures + slice breakdown before any code (P2)
  final_qa_report: true    # deliver the final run report to the human (P7)

thresholds:
  mutation_score_min: 80          # a score below this is a deviation only (D22), never a block
  coverage_policy: informational  # reported, never blocks; collected only by the merge-gate run
  complexity_policy: not-worse-than-baseline
  duplication_policy: not-worse-than-baseline

# Semantic send-back routes (mechanical gate failures are always repaired in place
# by the role that owns them — never routed).
send_back_routes:
  qa: coder
  architect: coder

# Quality gates (D20): enabled by default. lint/format/architecture block in the coder's final run and
# the architect; diff-coverage and constitution-traceability block at the merge gate. Disable all with
# enabled: false or one with gates.<name>: false.
quality_gates:
  enabled: true
  diff_coverage_min: 80
  # gates: {format: false}

# Mutation frameworks (Stryker/mutmut/PIT) run only when true; the hardener is semantic by default (D22).
mutation:
  framework_enabled: false

# Hardener and QA run concurrently after the architect (D16); false = sequential.
parallel:
  hardener_qa: true

return_limit: 3     # max send-backs per slice
parallel_limit: 3   # max concurrent worktree pipelines over independent slices

# Optional BDD framework (reqnroll | cucumber-js | behave). Absent = plain Gherkin
# document + test traceability via scenario-id tags.
# bdd_framework: reqnroll

night_mode_default: false
