project_name: "bob-pipeline"
version: "1.0.0"
ratified: "2026-07-29"
last_amended: "2026-07-29"
principles:
  - id: "P1"
    name: "Gauntlet instead of review"
    description: "Code quality is guaranteed by mechanically computable gates (tests, mutation score, complexity/duplication metrics), not by a human reading code. Code is never shown to the human; every quality verdict must be derived from tool output, not opinion."
    severity: "NON-NEGOTIABLE"
    gate_condition: "Every quality gate in the plan/tasks is defined as a check of tool output against a threshold or baseline; no step of the form 'human reviews the code' exists."
  - id: "P2"
    name: "Intent approval before code"
    description: "The human approves Gherkin specifications, QA procedures, and the slice breakdown before any implementation code is created (except night mode with explicit auto-approval). Intent is the only thing the human controls; after approval the pipeline is autonomous."
    severity: "NON-NEGOTIABLE"
    gate_condition: "No execution path exists in which implementation code is created before Gherkin approval (or the recorded night-mode auto-approval)."
  - id: "P3"
    name: "Clean role context and commit before handoff"
    description: "Each role runs as a subagent with a clean context (the verifier does not inherit the writer's self-deception) and must finish its work with a git commit labeled with the role. The commit history is the audit trail that replaces reading the code."
    severity: "NON-NEGOTIABLE"
    gate_condition: "Every role in the plan is launched as a separate subagent and ends with a role-labeled commit; the per-role diff is recoverable from git log."
  - id: "P4"
    name: "Run isolation"
    description: "A feature run never touches the user's working copy: execution happens in a dedicated git worktree, and merging is an explicit protocol at the end. A failed slice never reaches the merge."
    severity: "NON-NEGOTIABLE"
    gate_condition: "All file operations by roles happen inside the run's worktree; the merge into the user's branch is the single exit point for changes and is performed only for slices that passed their gates."
  - id: "P5"
    name: "Everything configurable, defaults as Bob does it"
    description: "Role composition, models, gates, thresholds, send-back routes, limits, and modes are defined by a project config with per-feature overrides; nothing is hardcoded. Defaults reproduce Uncle Bob's flow (full pipeline, two human gates, mutation score >= 80%)."
    severity: "NON-NEGOTIABLE"
    gate_condition: "Every pipeline behavior parameter mentioned in the plan/tasks is read from the config (or an override), never hardcoded; default values are captured in the config template."
  - id: "P6"
    name: "Stack agnosticism via registry"
    description: "The plugin is not tied to any language: quality tools are selected from a registry by stack; unknown stacks trigger guided research confirmed by the user; an unavailable category degrades explicitly, with a warning, never silently."
    severity: "NON-NEGOTIABLE"
    gate_condition: "No pipeline step invokes a tool by hardcoded name — only via the registry/config; the 'tool unavailable' scenario has a defined degradation behavior."
  - id: "P7"
    name: "Autonomy and honest reporting"
    description: "Night mode asks zero interactive questions; failures are neither hidden nor fixed endlessly — iteration limits apply, the diagnosis goes into the report, and a failed slice is marked and skipped. The report always records role skips, overrides, and degradations."
    severity: "NON-NEGOTIABLE"
    gate_condition: "Every repair loop has an iteration limit; every failure/skip/degradation must appear in the final report; night mode contains no interactive steps."
